name: Windows_onnx

on:
  issue_comment:
    types: [ created ]  # 监听 issue 评论创建事件

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      - name: 打印issue评论信息
        run: |
          echo "issue number :${{ github.event.issue.number }}"
          echo "issue 作者 :${{ github.event.comment.user.login }}"

      - name: 过滤issue评论
        if: github.event.issue.number != 1 || github.event.comment.user.login != 'xia-chu'
        run: exit 1

      - name: 获取分支和ci名
        run: |
          # 启用详细日志
          $ReleasePreference = "Continue"
          
          # 获取 GitHub 事件中的评论内容
          $input_string = "${{ github.event.comment.body }}"
          
          # 按空格拆分字符串
          $lines = $input_string -split '\s+'
          
          for ($i = 0; $i -lt $lines.Length; $i++) {
              $trimmed_line = $lines[$i].Trim()
          
              if ($i -eq 0) {
                  echo "分支: $trimmed_line"
                  Add-Content -Path $env:GITHUB_ENV -Value "BRANCH=$trimmed_line"
              } elseif ($i -eq 1) {
                  echo "ci名: $trimmed_line"
                  if ($trimmed_line -ne "all" -and $trimmed_line -ne "${{ github.workflow }}") {
                      echo "ci不匹配，且不是all，跳过"
                      exit 1
                  }
              }
          }

      - name: 下载源码
        uses: actions/checkout@v2
        with:
          repository: xia-chu/zlmediakit-promax
          fetch-depth: 1
          ref: ${{ env.BRANCH }}
          token: ${{ secrets.ACCESS_TOKEN }}
          path: .

      - name: 下载ai插件源码
        uses: actions/checkout@v2
        with:
          repository: xia-chu/yolov8_trt
          fetch-depth: 1
          ref: main
          token: ${{ secrets.ACCESS_TOKEN }}
          path: 3rdpart/yolov8_trt

      - name: 获取git hash
        run: |
          $hash = git log -1 --format="%H"
          Add-Content -Path $env:GITHUB_ENV -Value "HASH=$hash"

      - name: 下载submodule源码
        run: |
          mv -Force .gitmodules_github .gitmodules && git submodule sync && git submodule update --init
          Remove-Item -Path tests\*.cpp -Force
          Remove-Item -Path api\tests\*.c -Force
          Set-Location -Path "3rdpart/yolov8_trt"
          git submodule update --init

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
          architecture: x64

      - name: Set PYTHON_EXECUTABLE
        shell: pwsh
        run: |
          $pythonExe = python -c "import sys; print(sys.executable)"
          Add-Content -Path $Env:GITHUB_ENV -Value "PYTHON_EXECUTABLE=$pythonExe"

      - name: Check PYTHON_EXECUTABLE
        run: echo $Env:PYTHON_EXECUTABLE
        shell: pwsh

      - name: 缓存 vcpkg installed
        uses: actions/cache@v4
        with:
          path: vcpkg/installed
          # Bump version (v1 → v2 ...) when vcpkgArguments change to force cache refresh.
          key: vcpkg-Windows_onnx-x64-windows-release-e3ed41868d5034bc608eaaa58383cd6ecdbb5ffb-v3
          restore-keys: |
            vcpkg-Windows_onnx-x64-windows-release-e3ed41868d5034bc608eaaa58383cd6ecdbb5ffb-

      - name: 创建 libaec vcpkg 覆盖端口
        shell: pwsh
        run: |
          # Create an overlay port for libaec that uses GitHub instead of the
          # unavailable gitlab.dkrz.de mirror (which returns HTTP 429).
          # File contents are base64-encoded to avoid YAML indentation conflicts.
          $overlayDir = "C:\vcpkg-overlay-ports\libaec"
          New-Item -ItemType Directory -Force -Path $overlayDir | Out-Null
          function Write-Base64File($path, $b64) {
            [System.IO.File]::WriteAllBytes($path, [System.Convert]::FromBase64String($b64))
          }
          # portfile.cmake
          Write-Base64File "$overlayDir\portfile.cmake" ""
          # vcpkg.json
          Write-Base64File "$overlayDir\vcpkg.json" ""
          # usage
          Write-Base64File "$overlayDir\usage" "bGliYWVjIHByb3ZpZGVzIENNYWtlIHRhcmdldHM6CgogIGZpbmRfcGFja2FnZShsaWJhZWMgQ09ORklHIFJFUVVJUkVEKQogICMgbGliYWVjIEFQSQogIHRhcmdldF9saW5rX2xpYnJhcmllcyhtYWluIFBSSVZBVEUgbGliYWVjOjphZWMpCiAgIyBzemlwIGNvbXBhdGlibGUgQVBJCiAgdGFyZ2V0X2xpbmtfbGlicmFyaWVzKG1haW4gUFJJVkFURSBsaWJhZWM6OnN6KQo="
          # static-shared.patch
          Write-Base64File "$overlayDir\static-shared.patch" ""
          # cmake-config.patch
          Write-Base64File "$overlayDir\cmake-config.patch" ""

      - name: 配置 vcpkg
        uses: lukka/run-vcpkg@v7
        with:
          vcpkgDirectory: '${{github.workspace}}/vcpkg'
          vcpkgTriplet: x64-windows-release
          # 2025.11.2
          vcpkgGitCommitId: 'e3ed41868d5034bc608eaaa58383cd6ecdbb5ffb'
          vcpkgArguments: '--overlay-ports=C:/vcpkg-overlay-ports opus pkgconf eigen3 openssl libsrtp[openssl] harfbuzz freetype fribidi fontconfig ffmpeg[ffmpeg,nonfree,x264,x265,opus,freetype,fribidi,fontconfig,drawtext,nvcodec,qsv,amf,aom,dav1d,opencl,opengl,openh264,vpx,vulkan] aws-crt-cpp aws-sdk-cpp[core,s3,transfer] opencv4[contrib,core,dnn,freetype] onnxruntime-gpu'

      - name: 编译
        uses: lukka/run-cmake@v3
        with:
          useVcpkgToolchainFile: true
          cmakeBuildType: Release
          cmakeListsOrSettingsJson: CMakeListsTxtAdvanced
          buildDirectory: '${{github.workspace}}/build'
          buildWithCMakeArgs: '--config Release'
          cmakeAppendedArgs: '-DVCPKG_TARGET_TRIPLET=x64-windows-release -DPYTHON_EXECUTABLE=${{ env.PYTHON_EXECUTABLE }} -DENABLE_ONNX=ON -DONNXRUNTIME_PATH_ROOT=${{github.workspace}}\vcpkg\installed\x64-windows-release\ -DBUILD_SHARED_LIBS=off -DENABLE_AI=ON -DENABLE_FFMPEG=ON -DENABLE_API=OFF -DENABLE_TESTS=OFF -DCMAKE_BUILD_TYPE=Release'

      - name: 设置环境变量
        run: |
          # 处理 TAG，替换非法字符为 "_"
          $tag = "${{ env.BRANCH }}" -replace '[/\?%*:|"<>]', '_'
          Add-Content -Path $env:GITHUB_ENV -Value "TAG=$tag"
          
          # 获取当前日期 (YYYY-MM-DD)
          $date = Get-Date -Format "yyyy-MM-dd"
          Add-Content -Path $env:GITHUB_ENV -Value "DATE=$date"
          
          # 获取当前时间戳 (Unix 时间戳)
          $date2 = [int][double]::Parse((Get-Date -UFormat "%s"))
          Add-Content -Path $env:GITHUB_ENV -Value "DATE2=$date2"
          
          # 压缩 release 目录为 release.zip
          mv -Force release\windows\Release\Release\* release\windows\Release
          Remove-Item -Path release\windows\Release\Release -Force -Recurse
          
          New-Item -ItemType Directory -Force -Path "release\windows\Release\models"
          New-Item -ItemType Directory -Force -Path "release\windows\Release\python"
          New-Item -ItemType Directory -Force -Path "release\windows\Release\conf"
          
          Copy-Item -Path "${{github.workspace}}\vcpkg\installed\x64-windows-release\tools\ffmpeg\*" -Destination "release\windows\Release" -Force
          Copy-Item -Path "${{github.workspace}}\vcpkg\installed\x64-windows-release\lib\*" -Destination "release\windows\Release" -Force
          Copy-Item -Path "${{github.workspace}}\vcpkg\installed\x64-windows-release\bin\*" -Destination "release\windows\Release" -Force
          
          Copy-Item -Path "conf\*" -Destination "release\windows\Release\conf" -Recurse -Force
          Copy-Item -Path "3rdpart\yolov8_trt\cpp\detect\onnx_model\*" -Destination "release\windows\Release\models" -Recurse -Force
          Copy-Item -Path "3rdpart\yolov8_trt\cpp\detect\python" -Destination "release\windows\Release" -Recurse -Force
          Copy-Item -Path "3rdpart\yolov8_trt\cpp\detect\coco.yaml" -Destination "release\windows\Release" -Recurse -Force
    
          Remove-Item -Path release\windows\Release\*.lib -Force
          Remove-Item -Path release\windows\Release\*.pdb -Force
          Compress-Archive -Path release\windows\Release\* -DestinationPath release.zip -Force

      - name: 打包二进制
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.workflow }}_${{ env.TAG }}_${{ env.DATE }}
          path: release.zip
          if-no-files-found: error
          retention-days: 90

      - name: issue评论
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ACCESS_TOKEN }}
          script: |
            for (const issue_number of [3, 6])
            github.rest.issues.createComment({
              issue_number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '- 下载地址: [${{ github.workflow }}_${{ env.TAG }}_${{ env.DATE }}](${{ steps.upload.outputs.artifact-url }})\n'
                + '- 分支: ${{ env.BRANCH }}\n' 
                + '- git hash: ${{ env.HASH }} \n' 
                + '- 编译日期: ${{ env.DATE }}\n' 
                + '- 编译记录: [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\n'
                + '- 打包ci名: ${{ github.workflow }}\n'
                + '- 说明: 本二进制在Windows(x64)上编译，已开启硬件编解码, 启用onnxruntime(gpu) ai推理, 本程序依赖python3.14, 运行前请先安装python3.14\n' 
            })

