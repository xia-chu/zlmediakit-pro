name: Linux_trt118

on:
  issue_comment:
    types: [ created ]  # 监听 issue 评论创建事件
env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: docker.io
  USER_NAME: zlmediakit

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      - name: 打印issue评论信息
        run: |
          echo "issue number :${{ github.event.issue.number }}"
          echo "issue 作者 :${{ github.event.comment.user.login }}"

      - name: 过滤issue评论
        if: github.event.issue.number != 1 || github.event.comment.user.login != 'xia-chu'
        run: exit 1

      - name: 获取分支和ci名
        run: |
          #!/bin/bash
          set -x
          input_string="${{ github.event.comment.body }}"
          
          # Split into lines and trim each line
          IFS=' ' read -r -a lines <<< "$input_string"
          
          for (( i=0; i<${#lines[@]}; i++ )); do
            trimmed_line=$(echo "${lines[i]}" | sed -e 's/^[ \t]*//' -e 's/[ \t]*$//')
            lines[i]="$trimmed_line"
          done
          
          for (( i=0; i<${#lines[@]}; i++ )); do
            if [ "$i" -eq 0 ]; then
              echo "分支: ${lines[i]}"
              echo "BRANCH=${lines[i]}" >> $GITHUB_ENV
            elif [ "$i" -eq 1 ]; then
              echo "ci名: ${lines[i]}"
              if [ "${lines[i]}" != "all" ] && [ "${lines[i]}" != "${{ github.workflow }}" ]; then
                echo "ci不匹配，且不是all，跳过"
                exit 1
              fi
            fi
          done

      - name: 下载源码
        uses: actions/checkout@v2
        with:
          repository: xia-chu/zlmediakit-promax
          fetch-depth: 1
          ref: ${{ env.BRANCH }}
          token: ${{ secrets.ACCESS_TOKEN }}
          path: .

      - name: 下载ai插件源码
        uses: actions/checkout@v2
        with:
          repository: xia-chu/yolov8_trt
          fetch-depth: 1
          ref: main
          token: ${{ secrets.ACCESS_TOKEN }}
          path: 3rdpart/yolov8_trt

      - name: 下载vcpkg
        uses: actions/checkout@v2
        with:
          repository: microsoft/vcpkg
          fetch-depth: 1
          ref: b27f6bfad367d64f8f0f3296351c5d246e182bb4
          path: 3rdpart/vcpkg
          submodules: recursive

      - name: 缓存 vcpkg installed
        uses: actions/cache@v4
        with:
          path: 3rdpart/vcpkg/installed
          # Bump version (v1 → v2 ...) when vcpkg install arguments change to force cache refresh.
          key: vcpkg-Linux_trt118-b27f6bfad367d64f8f0f3296351c5d246e182bb4-v1
          restore-keys: |
            vcpkg-Linux_trt118-b27f6bfad367d64f8f0f3296351c5d246e182bb4-

      - name: 获取git hash
        run: |
          echo "HASH=$(git log -1 --format='%H')" >> $GITHUB_ENV

      - name: 下载 submodule 源码
        run: |
          mv .gitmodules_github .gitmodules
          git submodule sync
          git submodule update --init
          rm -f tests/*.cpp api/tests/*.c
          cd 3rdpart/yolov8_trt
          git submodule update --init

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.USER_NAME }}
          password: ${{ secrets.DOCKER_IO_SECRET }}

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache
          sudo docker system prune -af || true
          df -h

      - name: 启动 Docker 容器, 在Docker 容器中执行脚本
        run: |
          docker pull zlmediakit/cuda_dev:11.8
          docker run -v $(pwd):/root/git -w /root/git --rm zlmediakit/cuda_dev:11.8 sh -c "
            #!/bin/bash
            set -x
            apt update
            apt install -y git libeigen3-dev libssl-dev python3.9 libpython3.9-dev python3-pip python3.9-distutils curl zip unzip tar
            python3 --version
            gcc --version

            # 编译安装 aws-sdk-cpp 以开启 s3 云存储  Build aws-sdk-cpp to enable s3 cloud storage
            cd 3rdpart/vcpkg
            ./bootstrap-vcpkg.sh
            VCPKG_BUILD_TYPE=release ./vcpkg install aws-crt-cpp aws-sdk-cpp[core,s3,transfer] --triplet x64-linux-dynamic
            cd ../../

            mkdir -p build
            cd build
            cmake .. \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DPYTHON_EXECUTABLE=$(which python3) \
            -DENABLE_CUDA=ON \
            -DBUILD_SHARED_LIBS=off \
            -DENABLE_AI=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_WEBRTC=ON \
            -DENABLE_FFMPEG=ON \
            -DENABLE_TESTS=OFF \
            -DENABLE_S3=ON \
            -DVCPKG_TARGET_TRIPLET=x64-linux-dynamic \
            -DCMAKE_TOOLCHAIN_FILE=/root/git/3rdpart/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DCMAKE_CUDA_COMPILER=/usr/local/cuda/bin/nvcc \
            -DENABLE_API=OFF
          
            make -j $(nproc)
          
            cd ..
            rm -rf release/linux/Release/*.a
            mkdir -p release/linux/Release/depends/lib
            mkdir -p release/linux/Release/models 
            mkdir -p release/linux/Release/conf
          
            cp -rf conf/* release/linux/Release/conf 
            cp -rf 3rdpart/yolov8_trt/cpp/detect/onnx_model/* release/linux/Release/models/
            cp -rf 3rdpart/yolov8_trt/cpp/detect/python release/linux/Release/
            cp -rf 3rdpart/yolov8_trt/cpp/detect/coco.yaml release/linux/Release/
            cp -rfP 3rdpart/vcpkg/installed/x64-linux-dynamic/lib/*.so* release/linux/Release/depends/lib/
            rm -rf release/linux/Release/depends/lib/*.a

          "

      - name: 设置环境变量
        run: |
          echo "TAG=$(echo ${{ env.BRANCH }} | tr -s "/\?%*:|\"<>" "_")" >> $GITHUB_ENV  
          echo "DATE=$(date +%Y-%m-%d)" >> $GITHUB_ENV
          echo "DATE2=$(date +%s)" >> $GITHUB_ENV
          tar -czf release.tar.gz -C release/linux .

      - name: 打包二进制
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.workflow }}_${{ env.TAG }}_${{ env.DATE }}
          path: release.tar.gz
          if-no-files-found: error
          retention-days: 90

      - name: issue评论
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ACCESS_TOKEN }}
          script: |
            for (const issue_number of [3, 7])
            github.rest.issues.createComment({
              issue_number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '- 下载地址: [${{ github.workflow }}_${{ env.TAG }}_${{ env.DATE }}](${{ steps.upload.outputs.artifact-url }})\n'
                + '- 分支: ${{ env.BRANCH }}\n' 
                + '- git hash: ${{ env.HASH }} \n' 
                + '- 编译日期: ${{ env.DATE }}\n' 
                + '- 编译记录: [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\n'
                + '- 打包ci名: ${{ github.workflow }}\n'
                + '- 说明: 本二进制在 ubuntu20.04(x64) 上编译，开启tensorrt11.8(gpu) ai推理；请参考[wiki](https://github.com/xia-chu/zlmediakit-pro/wiki/Linux-tensorRT11.8%E6%8E%A8%E7%90%86%E6%95%99%E7%A8%8B)部署运行\n' 
            })


