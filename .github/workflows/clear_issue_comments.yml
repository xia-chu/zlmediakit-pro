name: ClearIssueComments

on:
  issue_comment:
    types: [ created ]  # 监听 issue 评论创建事件

jobs:
  clear:
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      contents: read

    steps:
      - name: 打印issue评论信息
        run: |
          echo "issue number :${{ github.event.issue.number }}"
          echo "issue 作者 :${{ github.event.comment.user.login }}"
          echo "评论内容 :${{ github.event.comment.body }}"

      - name: 过滤issue评论
        if: github.event.issue.number != 1 || github.event.comment.user.login != 'xia-chu'
        run: exit 1

      - name: 校验评论内容为clear
        if: github.event.comment.body != 'clear'
        run: |
          echo "评论内容不是clear，跳过"
          exit 1

      - name: 清除issue评论
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ACCESS_TOKEN }}
          script: |
            // 清理规则: issue编号 -> 需要保留的最早评论条数(其余全部删除)
            const rules = [
              { issue_number: 3, keep: 1 },
              { issue_number: 5, keep: 0 },
              { issue_number: 6, keep: 0 },
              { issue_number: 7, keep: 0 },
            ];
            for (const rule of rules) {
              // 按创建时间正序拉取全部评论，前 keep 条为需要保留的
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: rule.issue_number,
                per_page: 100,
              });
              comments.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
              const to_delete = comments.slice(rule.keep);
              console.log(`issue #${rule.issue_number}: 共 ${comments.length} 条评论, 保留 ${rule.keep} 条, 待删除 ${to_delete.length} 条`);
              for (const comment of to_delete) {
                try {
                  await github.rest.issues.deleteComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: comment.id,
                  });
                  console.log(`已删除评论 ${comment.id}`);
                } catch (e) {
                  console.log(`删除评论 ${comment.id} 失败: ${e.message}`);
                }
              }
            }
