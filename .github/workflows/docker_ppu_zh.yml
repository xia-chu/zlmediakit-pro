name: DockerPPUZh

on:
  issue_comment:
    types: [ created ]  # 监听 issue 评论创建事件

env:
  REGISTRY: warp-01-docker.pkg.coding.net
  IMAGE: uav/zlm/ppu_xzl
  TAG: master

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
      id-token: write
      actions: read  # 读取其他 workflow 的 artifacts

    steps:
      - name: 打印issue评论信息
        run: |
          echo "issue number :${{ github.event.issue.number }}"
          echo "issue 作者 :${{ github.event.comment.user.login }}"

      - name: 过滤issue评论
        if: github.event.issue.number != 1 || github.event.comment.user.login != 'xia-chu'
        run: exit 1

      - name: 获取分支、ci名和可选的 LinuxPPU run_id
        run: |
          #!/bin/bash
          set -ex
          input_string="${{ github.event.comment.body }}"

          # Split into lines and trim each line
          IFS=' ' read -r -a lines <<< "$input_string"

          for (( i=0; i<${#lines[@]}; i++ )); do
            trimmed_line=$(echo "${lines[i]}" | sed -e 's/^[ \t]*//' -e 's/[ \t]*$//')
            lines[i]="$trimmed_line"
          done

          for (( i=0; i<${#lines[@]}; i++ )); do
            if [ "$i" -eq 0 ]; then
              echo "分支: ${lines[i]}"
              echo "BRANCH=${lines[i]}" >> $GITHUB_ENV
            elif [ "$i" -eq 1 ]; then
              echo "ci名: ${lines[i]}"
              if [ "${lines[i]}" != "${{ github.workflow }}" ]; then
                echo "ci不匹配，且不是all，跳过"
                exit 1
              fi
            elif [ "$i" -eq 2 ] && [ -n "${lines[i]}" ]; then
              echo "LinuxPPU run_id: ${lines[i]}"
              echo "PPU_RUN_ID=${lines[i]}" >> $GITHUB_ENV
            fi
          done

      - name: 获取 LinuxPPU run_id
        run: |
          #!/bin/bash
          set -ex
          if [ -z "${PPU_RUN_ID}" ]; then
            # 自动查找该分支最新的成功 LinuxPPU 运行  Auto-detect latest successful LinuxPPU run
            RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.ACCESS_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/linux_ppu.yml/runs?branch=${{ env.BRANCH }}&status=success&per_page=1")
            PPU_RUN_ID=$(echo "$RESPONSE" | jq -r '.workflow_runs[0].id // empty')
            if [ -z "$PPU_RUN_ID" ]; then
              echo "未找到分支 ${{ env.BRANCH }} 的成功 LinuxPPU 运行，请检查分支名或手动提供 run_id"
              exit 1
            fi
            echo "PPU_RUN_ID=${PPU_RUN_ID}" >> $GITHUB_ENV
          fi
          echo "使用 LinuxPPU run_id: ${PPU_RUN_ID}"

      - name: 下载 LinuxPPU 编译产出
        run: |
          #!/bin/bash
          set -ex
          # 列出 artifacts  List artifacts for this run
          ARTIFACTS=$(curl -s -H "Authorization: token ${{ secrets.ACCESS_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${PPU_RUN_ID}/artifacts")

          # 找到第一个 artifact 的下载 URL  Find the first artifact download URL
          DOWNLOAD_URL=$(echo "$ARTIFACTS" | jq -r '.artifacts[0].archive_download_url // empty')
          if [ -z "$DOWNLOAD_URL" ]; then
            echo "未找到 artifact，请确认 LinuxPPU 运行已成功完成"
            exit 1
          fi

          ARTIFACT_NAME=$(echo "$ARTIFACTS" | jq -r '.artifacts[0].name')
          echo "下载 artifact: ${ARTIFACT_NAME}"

          # 下载 artifact zip  Download artifact zip
          curl -s -L -H "Authorization: token ${{ secrets.ACCESS_TOKEN }}" \
            -o artifact.zip "$DOWNLOAD_URL"

          # 解压: zip 内含 release.tar.gz，tar 内含 linux/Release/...
          unzip -o artifact.zip
          mkdir -p release/linux
          tar -xzf release.tar.gz -C release/linux
          rm -f artifact.zip release.tar.gz

          echo "Release 目录内容:"
          ls -la release/linux/Release/

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_IO_NAME_ZH }}
          password: ${{ secrets.DOCKER_IO_SECRET_ZH }}

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache
          sudo docker system prune -af || true
          df -h

      - name: 准备 Docker 构建上下文
        run: |
          RELEASE_DIR=release/linux/Release
          # 生成 start.sh 启动脚本
          echo '#!/bin/bash' > ${RELEASE_DIR}/start.sh
          echo 'export LD_LIBRARY_PATH=./depends/lib:/usr/local/cuda/lib64' >> ${RELEASE_DIR}/start.sh
          echo 'export PYTHONPATH=./python' >> ${RELEASE_DIR}/start.sh
          echo 'exec ./MediaServer -s default.pem -c ./conf/config.ini -l 1' >> ${RELEASE_DIR}/start.sh
          chmod +x ${RELEASE_DIR}/start.sh
          # 生成 python 插件依赖清单(onnxruntime 用 linux_ppu 产出的 PPU wheel, 不走 PyPI)
          cat > ${RELEASE_DIR}/requirements.txt <<'EOF'
          # Common dependencies for the Python plugins.
          numpy>=1.24,<3
          opencv-python-headless>=4.8,<5
          Pillow>=10,<13
          protobuf>=3.20.3,<8
          # areaPlugin, OCR plugin imports, and coordinate conversion utilities.
          Shapely>=1.8.5,<3
          sympy>=1.12,<2
          pyproj>=3.5,<4
          geopy>=2.3,<3
          # AIS WebSocket client.
          websocket-client>=1.6,<2
          # MQTT, including the bundled client's optional DNS SRV and proxy imports.
          paho-mqtt==2.1.0
          dnspython>=2.3,<3
          PySocks>=1.7.1,<2
          # Compatibility imports used by bundled paho-mqtt on older Python versions.
          typing-extensions>=4.4,<5
          EOF
          # 生成 Dockerfile
          echo 'FROM zlmediakit/zlm_dev:ppu' > ${RELEASE_DIR}/Dockerfile
          echo '' >> ${RELEASE_DIR}/Dockerfile
          echo 'EXPOSE 1935/tcp' >> ${RELEASE_DIR}/Dockerfile
          echo 'EXPOSE 554/tcp' >> ${RELEASE_DIR}/Dockerfile
          echo 'EXPOSE 80/tcp' >> ${RELEASE_DIR}/Dockerfile
          echo 'EXPOSE 443/tcp' >> ${RELEASE_DIR}/Dockerfile
          echo 'EXPOSE 10000/udp' >> ${RELEASE_DIR}/Dockerfile
          echo 'EXPOSE 10000/tcp' >> ${RELEASE_DIR}/Dockerfile
          echo 'EXPOSE 8000/udp' >> ${RELEASE_DIR}/Dockerfile
          echo 'EXPOSE 8000/tcp' >> ${RELEASE_DIR}/Dockerfile
          echo 'EXPOSE 9000/udp' >> ${RELEASE_DIR}/Dockerfile
          echo '' >> ${RELEASE_DIR}/Dockerfile
          echo 'RUN apt-get update && apt-get install -y --no-install-recommends python3-pip && rm -rf /var/lib/apt/lists/*' >> ${RELEASE_DIR}/Dockerfile
          echo '' >> ${RELEASE_DIR}/Dockerfile
          # ubuntu24.04 的 python 为 externally-managed 环境, 需 --break-system-packages 才允许 pip 全局安装
          echo 'RUN python3 -m pip install --no-cache-dir --break-system-packages "boto3>=1.28.0" "kafka-python>=2.0.2" attrs cython decorator sympy cffi pyyaml pathlib2 psutil scipy requests absl-py "fastapi>=0.110.0" "uvloop>=0.19.0"' >> ${RELEASE_DIR}/Dockerfile
          echo '' >> ${RELEASE_DIR}/Dockerfile
          echo 'WORKDIR /opt/media/bin' >> ${RELEASE_DIR}/Dockerfile
          echo '' >> ${RELEASE_DIR}/Dockerfile
          echo 'COPY . /opt/media/bin' >> ${RELEASE_DIR}/Dockerfile
          echo '' >> ${RELEASE_DIR}/Dockerfile
          echo 'RUN python3 -m pip install --no-cache-dir --break-system-packages -r /opt/media/bin/requirements.txt' >> ${RELEASE_DIR}/Dockerfile
          echo '' >> ${RELEASE_DIR}/Dockerfile
          # PyPI 的 onnxruntime-gpu 是 NVIDIA 架构预编译 kernel, PPU 上跑不了;
          # 这里装的是 linux_ppu 用 PPU 工具链编译出的 wheel, 装完删除以免镜像里留两份
          echo 'RUN python3 -m pip install --no-cache-dir --break-system-packages /opt/media/bin/depends/wheel/onnxruntime_gpu-*.whl && rm -rf /opt/media/bin/depends/wheel' >> ${RELEASE_DIR}/Dockerfile
          echo '' >> ${RELEASE_DIR}/Dockerfile
          echo 'RUN python3 -c "import onnxruntime as ort; print(ort.__version__, ort.get_available_providers())"' >> ${RELEASE_DIR}/Dockerfile
          echo '' >> ${RELEASE_DIR}/Dockerfile
          echo 'CMD ["/opt/media/bin/start.sh"]' >> ${RELEASE_DIR}/Dockerfile

      - name: 构建并推送 Docker 镜像
        id: build-and-push
        uses: docker/build-push-action@ac9327eae2b366085ac7f6a2d02df8aa8ead720a
        with:
          context: release/linux/Release
          file: release/linux/Release/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ env.TAG }}
          platforms: linux/amd64
