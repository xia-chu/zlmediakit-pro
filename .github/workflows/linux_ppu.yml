name: LinuxPPU

on:
  issue_comment:
    types: [ created ]  # 监听 issue 评论创建事件
env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: docker.io
  USER_NAME: zlmediakit

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      - name: 打印issue评论信息
        run: |
          echo "issue number :${{ github.event.issue.number }}"
          echo "issue 作者 :${{ github.event.comment.user.login }}"

      - name: 过滤issue评论
        if: github.event.issue.number != 1 || github.event.comment.user.login != 'xia-chu'
        run: exit 1

      - name: 获取分支和ci名
        run: |
          #!/bin/bash
          set -x
          input_string="${{ github.event.comment.body }}"

          # Split into lines and trim each line
          IFS=' ' read -r -a lines <<< "$input_string"

          for (( i=0; i<${#lines[@]}; i++ )); do
            trimmed_line=$(echo "${lines[i]}" | sed -e 's/^[ \t]*//' -e 's/[ \t]*$//')
            lines[i]="$trimmed_line"
          done

          for (( i=0; i<${#lines[@]}; i++ )); do
            if [ "$i" -eq 0 ]; then
              echo "分支: ${lines[i]}"
              echo "BRANCH=${lines[i]}" >> $GITHUB_ENV
            elif [ "$i" -eq 1 ]; then
              echo "ci名: ${lines[i]}"
              if [ "${lines[i]}" != "all" ] && [ "${lines[i]}" != "${{ github.workflow }}" ]; then
                echo "ci不匹配，且不是all，跳过"
                exit 1
              fi
            fi
          done

      - name: 下载源码
        uses: actions/checkout@v2
        with:
          repository: xia-chu/zlmediakit-promax
          fetch-depth: 1
          ref: ${{ env.BRANCH }}
          token: ${{ secrets.ACCESS_TOKEN }}
          path: .

      - name: 下载ai插件源码
        uses: actions/checkout@v2
        with:
          repository: xia-chu/yolov8_trt
          fetch-depth: 1
          ref: main
          token: ${{ secrets.ACCESS_TOKEN }}
          path: 3rdpart/yolov8_trt

      - name: 下载onnxruntime源码
        uses: actions/checkout@v2
        with:
          repository: microsoft/onnxruntime
          fetch-depth: 1
          ref: v1.23.2
          path: 3rdpart/onnxruntime
          submodules: recursive

      - name: 下载vcpkg
        uses: actions/checkout@v2
        with:
          repository: microsoft/vcpkg
          fetch-depth: 1
          ref: b27f6bfad367d64f8f0f3296351c5d246e182bb4
          path: 3rdpart/vcpkg
          submodules: recursive

      - name: 缓存 vcpkg installed
        uses: actions/cache@v4
        with:
          path: 3rdpart/vcpkg/installed
          # Bump version (v1 → v2 ...) when vcpkg install arguments change to force cache refresh.
          key: vcpkg-LinuxPPU-b27f6bfad367d64f8f0f3296351c5d246e182bb4-v1
          restore-keys: |
            vcpkg-LinuxPPU-b27f6bfad367d64f8f0f3296351c5d246e182bb4-

      - name: 缓存 onnxruntime(cuda) 编译产物
        uses: actions/cache@v4
        with:
          # 容器内固定挂载到 /root/git, cmake 缓存中的绝对路径可复用
          path: 3rdpart/onnxruntime/build
          # Bump version (v1 → v2 ...) when onnxruntime version or build arguments change to force cache refresh.
          key: onnxruntime-LinuxPPU-cuda-v1.30.0-v1
          restore-keys: |
            onnxruntime-LinuxPPU-cuda-v1.30.0-

      - name: 获取git hash
        run: |
          echo "HASH=$(git log -1 --format='%H')" >> $GITHUB_ENV

      - name: 下载 submodule 源码
        run: |
          mv .gitmodules_github .gitmodules
          git submodule sync
          git submodule update --init
          rm -f tests/*.cpp api/tests/*.c
          cd 3rdpart/yolov8_trt
          git submodule update --init

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.USER_NAME }}
          password: ${{ secrets.DOCKER_IO_SECRET }}

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache
          sudo docker system prune -af || true
          df -h

      - name: 启动 Docker 容器, 在Docker 容器中执行脚本
        run: |
          docker pull zlmediakit/zlm_dev:ppu
          docker run -v $(pwd):/root/git -w /root/git --rm zlmediakit/zlm_dev:ppu sh -c "
            #!/bin/bash
            set -x

            # 安装编译依赖 Install build dependencies
            apt update
            apt install -y ffmpeg libavcodec-dev libavformat-dev libavutil-dev libavfilter-dev libavdevice-dev libswscale-dev libswresample-dev libssl-dev libopus-dev libharfbuzz-dev libfreetype-dev libfribidi-dev libfontconfig-dev libjemalloc-dev
            apt-get install -y curl zip unzip tar git python3 python3-dev

            python3 --version
            gcc --version
            nvcc --version

            # 升级 CMake 到 3.31.6 (onnxruntime v1.30 要求 CMake>=3.28, 且 ZLM 使用 CMAKE_POLICY_VERSION_MINIMUM 需 CMake>=3.31)
            curl -fsSL -o /tmp/cmake.tar.gz https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-linux-x86_64.tar.gz
            tar -xzf /tmp/cmake.tar.gz -C /opt
            ln -sf /opt/cmake-3.31.6-linux-x86_64/bin/* /usr/local/bin/
            hash -r
            which cmake
            cmake --version

            # 编译安装 onnxruntime(开启 cuda) Build and install onnxruntime with cuda
            # 命中缓存时跳过编译, 仅重新 make install(容器内 /usr/local 为临时文件系统)
            cd /root/git/3rdpart/onnxruntime
            # 净化被污染的编译环境变量: 容器内 CFLAGS/CXXFLAGS 若含 -Werror 或杂散 token,
            # 会导致 -Werror=unused-parameter 及 cannot specify -o with multiple files 编译错误
            echo '=== build env (before sanitize) ==='; env | grep -iE 'CFLAGS|CXXFLAGS|^CC=|^CXX=|NVCC_' || true
            if ! ls build/Linux/Release/libonnxruntime.so* >/dev/null 2>&1; then
              env CFLAGS='-Wno-error' CXXFLAGS='-Wno-error' sh ./build.sh --allow_running_as_root --skip_tests --build_shared_lib --use_cuda --cuda_home /usr/local/cuda --parallel \$(nproc) --config Release --cmake_extra_defines CMAKE_POLICY_VERSION_MINIMUM=3.5
            fi
            cd /root/git/3rdpart/onnxruntime/build/Linux/Release
            make install
            cd /root/git

            # 安装 vcpkg 依赖 Install vcpkg dependencies
            cd /root/git/3rdpart/vcpkg
            ./bootstrap-vcpkg.sh
            VCPKG_BUILD_TYPE=release ./vcpkg install libsrtp[openssl] aws-crt-cpp aws-sdk-cpp[core,s3,transfer] pkgconf eigen3 opencv4[core,contrib,freetype,dnn] --triplet x64-linux-dynamic
            cd ../../
            
            cd /root/git

            export PKG_CONFIG_PATH=/root/git/3rdpart/vcpkg/installed/x64-linux-dynamic/lib/pkgconfig:\$PKG_CONFIG_PATH
            export LD_LIBRARY_PATH=/root/git/3rdpart/vcpkg/installed/x64-linux-dynamic/lib:\$LD_LIBRARY_PATH

            mkdir -p build
            cd build
            cmake .. \
            -DENABLE_API=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_FFMPEG=on \
            -DENABLE_S3=on \
            -DCMAKE_TOOLCHAIN_FILE=/root/git/3rdpart/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=x64-linux-dynamic \
            -DENABLE_ONNX=ON \
            -DONNXRUNTIME_PATH_ROOT=/usr/local/ \
            -DOpenCV_ROOT=/root/git/3rdpart/vcpkg/installed/x64-linux-dynamic/share/opencv4 \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DBUILD_SHARED_LIBS=off \
            -DENABLE_AI=ON \
            -DPython3_EXECUTABLE=\$(which python3) \
            -DENABLE_PYTHON=ON \
            -DCMAKE_CUDA_COMPILER=/usr/local/cuda/bin/nvcc

            make -j \$(nproc)

            cd ..
            rm -rf release/linux/Release/*.a
            mkdir -p release/linux/Release/depends/lib
            mkdir -p release/linux/Release/models
            mkdir -p release/linux/Release/conf

            cp -rf conf/* release/linux/Release/conf
            cp -rf 3rdpart/yolov8_trt/cpp/detect/onnx_model/* release/linux/Release/models/
            cp -rf 3rdpart/yolov8_trt/cpp/detect/python release/linux/Release/
            cp -rf 3rdpart/yolov8_trt/cpp/detect/coco.yaml release/linux/Release/
            cp -rfP 3rdpart/vcpkg/installed/x64-linux-dynamic/lib/*.so* release/linux/Release/depends/lib/
            cp -rfP /usr/local/lib64/libonnxruntime* release/linux/Release/depends/lib/ 2>/dev/null || true
            cp -rfP /usr/local/lib/libonnxruntime* release/linux/Release/depends/lib/ 2>/dev/null || true
            rm -rf release/linux/Release/depends/lib/*.a

          "

      - name: 设置环境变量
        run: |
          echo "TAG=$(echo ${{ env.BRANCH }} | tr -s "/\?%*:|\"<>" "_")" >> $GITHUB_ENV
          echo "DATE=$(date +%Y-%m-%d)" >> $GITHUB_ENV
          echo "DATE2=$(date +%s)" >> $GITHUB_ENV
          tar -czf release.tar.gz -C release/linux .

      - name: 打包二进制
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.workflow }}_${{ env.TAG }}_${{ env.DATE }}
          path: release.tar.gz
          if-no-files-found: error
          retention-days: 90

      - name: issue评论
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ACCESS_TOKEN }}
          script: |
            for (const issue_number of [3, 7])
            github.rest.issues.createComment({
              issue_number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '- 下载地址: [${{ github.workflow }}_${{ env.TAG }}_${{ env.DATE }}](${{ steps.upload.outputs.artifact-url }})\n'
                + '- 分支: ${{ env.BRANCH }}\n'
                + '- git hash: ${{ env.HASH }} \n'
                + '- 编译日期: ${{ env.DATE }}\n'
                + '- 编译记录: [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\n'
                + '- 打包ci名: ${{ github.workflow }}\n'
                + '- 说明: 本二进制在 ubuntu24.04(x64) 上编译(zlmediakit/zlm_dev:ppu)，已开启 cuda 硬件加速, 开启 onnxruntime(cuda) ai 推理, 开启 ffmpeg/s3/python 插件\n'
            })
